<div class="p-grid p-justify-center">
  <div class="p-col-12 p-md-8 p-lg-6">
    <p-card>
      <ng-template pTemplate="header">
        <h1 class="text-center p-mb-4">Crear encuesta</h1>
      </ng-template>


      <div *ngIf="!formIsValid && questions.length > 0" class="text-right error-box mb-4 p-p-3">
        <p-message severity="error" text="Encuesta inválida "></p-message>
      </div>

      <div *ngIf="formIsValid" class="text-right success-box mb-4 p-p-3">
        <p-message severity="success" text="Estado: Encuesta válida "></p-message>
      </div>

      <!-- Contenedor de mensajes de error y éxito -->
      <div *ngIf="errorMessages.length > 0" class="error-box p-mb-4 p-p-3">
        <span><strong>Ayuda para crear una encuesta:</strong></span>
        <ul>
          <li *ngFor="let errorMessage of errorMessages">{{ errorMessage }}</li>
        </ul>
      </div>

      <div class="p-fluid">
        <div class="p-field">
          <label for="surveyTitle">Título de la Encuesta</label>
          <input
            id="surveyTitle"
            type="text"
            pInputText
            [(ngModel)]="tituloEncuesta"
            placeholder="Ingrese el título"
            class="mt-2"
            (ngModelChange)="validateSurvey()"
          />
        </div>

        <div *ngFor="let question of questions; let i = index; trackBy: trackByIndex" class="mt-4">
          <p-fieldset [legend]="'Pregunta ' + (i + 1)" [toggleable]="true">
            <div class="p-field mt-2">
              <span class="p-float-label">
                <input
                  id="question-{{ i }}"
                  type="text"
                  pInputText
                  [(ngModel)]="question.tituloPregunta"
                  placeholder="Título de la pregunta"
                  (ngModelChange)="validateSurvey()"
                />
                <label for="question-{{ i }}">Título de la pregunta</label>
              </span>
            </div>

            <div class="p-field mt-3">
              <p-dropdown
                [options]="questionTypes"
                [(ngModel)]="question.type"
                placeholder="Seleccione el tipo de pregunta"
                [style]="{ 'width': '100%' }"
                (ngModelChange)="validateSurvey()"
              ></p-dropdown>
            </div>

            <div *ngIf="question.type === 'multiple'" class="mt-2">
              <div *ngFor="let option of question.options; let j = index; trackBy: trackByIndex" class="p-field mb-2">
                <div class="p-inputgroup mt-2">
                  <input
                    type="text"
                    pInputText
                    [(ngModel)]="question.options[j]"
                    placeholder="Opción {{ j + 1 }}"
                    (ngModelChange)="validateSurvey()"/>
                  <button
                    type="button"
                    pButton
                    icon="pi pi-trash"
                    (click)="removeOption(i, j)"
                    class="p-button-danger ml-1 p-button-text"
                  ></button>
                </div>
              </div>
              <!-- Contenedor con flexbox para alinear el botón "Eliminar" a la derecha -->
              <div class="flex">
                <p-button
                  [disabled]="question.options.length > 4"
                  label="Opción"
                  icon="pi pi-plus"
                  (onClick)="addOption(i)"
                  styleClass=" p-button-outlined p-button-secondary mt-2">
              </p-button>
                <p-button
                  label="Eliminar"
                  icon="pi pi-trash"
                  (onClick)="removeQuestion(i)"
                  styleClass=" p-button-danger mt-2 ml-4">
              </p-button>
              </div>
            </div>
          </p-fieldset>
        </div>
      </div>

      <div>
        <p-button
          label="Agregar pregunta"
          (onClick)="addQuestion()"
          icon="pi pi-plus"
          styleClass="p-button-outlined mt-3 mr-2"
        ></p-button>
      </div>
    </p-card>

    <div class="text-right mr-2">
      <p-button
        [disabled]="!formIsValid"
        pRipple
        label="Guardar encuesta"
        (onClick)="saveSurvey()"
        icon="pi pi-save"
        styleClass="p-button-success mt-3 mr-2"
      ></p-button>
    </div>
  </div>
</div>
