

<div class="p-grid p-justify-center">
  <div class="p-col-12 p-md-8 p-lg-6">
    <p-card>
      <ng-template pTemplate="header">
        <h1 class="text-center p-mb-4">Crear encuesta</h1>
      </ng-template>

      <div class="p-fluid">
        <div class="p-field">
          <label for="surveyTitle">Título de la Encuesta</label>
          <input id="surveyTitle" type="text" pInputText [(ngModel)]="surveyTitle" placeholder="Ingrese el título" class="mt-2" />
        </div>

        <div *ngFor="let question of questions; let i = index; trackBy: trackByIndex" class="mt-4">
          <p-fieldset [legend]="'Pregunta ' + (i + 1)" [toggleable]="true">
            <div class="p-field mt-2">
              <span class="p-float-label">
                <input id="question-{{ i }}" type="text" pInputText [(ngModel)]="question.text" placeholder="Título de la pregunta" />
                <label for="question-{{ i }}">Título de la pregunta</label>
              </span>
            </div>

            <div class="p-field mt-3">
              <p-dropdown [options]="questionTypes" [(ngModel)]="question.type" placeholder="Seleccione el tipo de pregunta" [style]="{'width':'100%'}">
              </p-dropdown>
            </div>

            <div *ngIf="question.type === 'multiple'" class="mt-2">
              <div *ngFor="let option of question.options; let j = index; trackBy: trackByIndex" class="p-field mb-2">
                <div class="p-inputgroup mt-2">
                  <input type="text" pInputText [(ngModel)]="question.options[j]" placeholder="Opción {{ j + 1 }}" />
                  <button
                    type="button"
                    pButton icon="pi pi-trash"
                    (click)="removeOption(i, j)"
                    class="p-button-danger ml-1 p-button-text">
                  </button>
                </div>
              </div>
              <p-button
                [disabled]="question.options.length > 4"
                label="Agregar Opción"
                icon="pi pi-plus"
                (onClick)="addOption(i)"
                styleClass="p-button-outlined p-button-secondary mt-2">
              </p-button>
            </div>

            <div>
              <p-button label="Eliminar pregunta" icon="pi pi-trash" (onClick)="removeQuestion(i)" styleClass="p-button-danger p-button-Mm mt-3"></p-button>
            </div>
          </p-fieldset>
        </div>
      </div>

      <div>
        <p-button
          label="Agregar pregunta"
          (onClick)="addQuestion()"
          icon="pi pi-plus"
          styleClass="p-button-outlined p-button-Mm mt-3 mr-2"
        ></p-button>
      </div>
    </p-card>

     <div>
        <p-button
        [disabled]="questions.length === 0"
          pRipple
          label="Guardar encuesta"
          (onClick)="saveSurvey()"
          icon="pi pi-save"
          styleClass="p-button-success p-button-Mm mt-3 mr-2">
        </p-button>
     </div>
  </div>
</div>
