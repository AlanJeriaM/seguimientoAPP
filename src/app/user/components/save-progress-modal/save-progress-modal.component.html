<p-dialog
  [(visible)]="visible"
  header="Guardar progreso"
  [modal]="true"
  [style]="{width: '90vw', maxWidth: '500px'}"
  [contentStyle]="{'padding': '0'}"
  [draggable]="false"
  [resizable]="false"
  [appendTo]="'body'"
  [baseZIndex]="1000"
  [closable]="true"
  [closeOnEscape]="true"
  [responsive]="true"
  [breakpoints]="{'960px': '95vw', '640px': '98vw'}"
  [dismissableMask]="true"
  (onHide)="handleHide()"
>
  <div class="p-4">
    <div class="surface-50 p-4 border-round-lg">
      <div class="text-center">
        <div class="flex justify-content-center mb-4">
          <div class="bg-orange-500 text-white border-circle flex align-items-center justify-content-center"
               style="width: 3rem; height: 3rem;">
            <i class="pi pi-save text-xl"></i>
          </div>
        </div>

        <p class="text-600 text-lg mb-3">
          Tienes un {{ progress }}% de progreso completado.
        </p>
        <p class="text-600 mb-0">
          ¿Deseas guardar tu progreso antes de salir?
        </p>
      </div>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex flex-column xl:flex-row flex-wrap gap-2 justify-content-end w-full">
      <p-button
        label="Salir sin guardar"
        icon="pi pi-sign-out"
        (click)="handleExitWithoutSaving()"
        styleClass="p-button-danger w-full xl:w-auto order-2 sm:order-2"
        [disabled]="saving">
      </p-button>

      <p-button
        label="Guardar y salir"
        icon="pi pi-save"
        (click)="handleSaveAndExit()"
        styleClass="p-button-success w-full xl:w-auto order-1 sm:order-3"
        [loading]="saving"
        [disabled]="saving">
      </p-button>
    </div>
  </ng-template>
</p-dialog>
