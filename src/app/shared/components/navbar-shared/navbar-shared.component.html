<p-toolbar styleClass="custom-toolbar">
  <!-- Contenido izquierdo -->
  <ng-template pTemplate="start">
    <div class="navbar-start">
      <!-- Sidebar solo cuando no es auth -->
      <div *ngIf="!isAuth()" class="sidebar-wrapper">
        <app-sidebar [nameUser]="userName" [isAdmin]="isAdmin()"></app-sidebar>
      </div>

      <!-- Logo y título -->
      <a [routerLink]="getHomeRoute()" class="brand-link">
        <img src="assets/icons/logouv.png" alt="UV Logo" class="brand-logo" />
        <span class="brand-text">Seguimiento egresados</span>
      </a>
    </div>
  </ng-template>

  <!-- Contenido derecho -->
  <ng-template pTemplate="end">
    <div class="navbar-end" *ngIf="!isAuth()">
      <!-- Avatar y menú solo cuando no es auth -->
      <p-button
        icon="pi pi-user"
        [rounded]="true"
        [outlined]="true"
        severity="secondary"
        (click)="menu.toggle($event)"
        [ariaLabel]="'Menú de usuario'"
        class="user-menu-btn"
      ></p-button>

      <p-tieredMenu
        #menu
        [model]="menuItems"
        [popup]="true"
        appendTo="body"
      ></p-tieredMenu>
    </div>
  </ng-template>
</p-toolbar>
