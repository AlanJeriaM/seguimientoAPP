<!-- Botón para abrir/cerrar el sidebar -->
<button
  type="button"
  pButton
  icon="pi pi-bars"
  [style]="{'background': '#1960a6', 'border': 'none', 'color': 'white'}"
  (click)="toggleSidebar()">
</button>

<!-- Sidebar sin modal en desktop, con modal en tablet/mobile -->
<p-sidebar
  [(visible)]="visibleSidebar"
  [position]="'left'"
  [modal]="isModalMode()"
  [showCloseIcon]="false"
  [baseZIndex]="isModalMode() ? 1000 : 1"
  [style]="{'width': '320px', 'border-radius': '0 5px 5px 0'}"
  styleClass="custom-sidebar-push"
  (onHide)="removeBodyClass()">

  <!-- Header -->
  <ng-template pTemplate="header">
    <div class="flex align-items-center justify-content-between w-full px-3 py-2">
      <div class="flex align-items-center gap-2">
        <i class="pi" [ngClass]="isAdmin ? 'pi-shield' : 'pi-user'" style="font-size: 1.2rem;"></i>
        <span class="font-semibold">{{ isAdmin ? 'Administrador' : 'Panel usuario' }}</span>
      </div>
      <button
        type="button"
        pButton
        icon="pi pi-times"
        class="p-button-rounded p-button-text p-button-sm"
        (click)="toggleSidebar()">
      </button>
    </div>
  </ng-template>

  <!-- Contenido principal -->
  <div class="flex flex-column gap-3 px-3 py-2 h-full">

    <!-- Card de perfil -->
    <div
      class="surface-card border-round shadow-2 cursor-pointer transition-all transition-duration-300 hover:shadow-4"
      style="border-radius: 5px; overflow: hidden;"
      (click)="goToPerfil()">

      <!-- Background header -->
      <div class="h-5rem relative" style="background: linear-gradient(135deg, #1960a6 0%, #0A66C2 100%);"></div>

      <!-- Contenido del perfil -->
      <div class="flex flex-column align-items-center px-3 pb-3" style="margin-top: -2.5rem;">

        <!-- Avatar -->
        <div class="relative mb-2">
          <img
            *ngIf="!isAdmin && perfilImagenUrl && !imageError"
            [src]="perfilImagenUrl"
            alt="Perfil"
            class="border-circle border-3 border-white shadow-3"
            style="width: 5rem; height: 5rem; object-fit: cover;"
            (error)="handleImageError($event)" />

          <div
            *ngIf="!isAdmin && (!perfilImagenUrl || imageError)"
            class="border-circle border-3 border-white shadow-3 flex align-items-center justify-content-center text-white font-bold text-2xl"
            style="width: 5rem; height: 5rem; background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);">
            <span>{{ getUserInitials() }}</span>
          </div>

          <img
            *ngIf="isAdmin"
            class="border-circle border-3 border-white shadow-3"
            style="width: 5rem; height: 5rem; object-fit: cover;"
            [src]="'assets/icons/admin4.png'"
            alt="Admin" />

          <!-- Indicador de estado -->
          <div
            class="absolute border-circle border-2 border-white"
            style="width: 1rem; height: 1rem; bottom: 0.25rem; right: 0.25rem; background: #10b981;">
          </div>
        </div>

        <!-- Nombre y rol -->
        <div class="flex flex-column align-items-center gap-2 w-full">
          <h3 class="m-0 font-bold text-900 text-center line-height-3" style="font-size: 1.1rem;">
            {{ nameUser }}
          </h3>
          <span
            class="inline-flex align-items-center gap-2 px-3 py-1 surface-100 text-600 font-semibold text-sm"
            style="border-radius: 5px;">
            <i class="pi pi-circle-fill" style="font-size: 0.4rem;"></i>
            {{ isAdmin ? 'Administrador' : 'Egresado' }}
          </span>
        </div>
      </div>
    </div>

    <!-- Navegación -->
    <nav class="flex-grow-1 overflow-y-auto">
      <p-panelMenu
        [model]="itemsPanelMenu"
        styleClass="custom-panel-menu-push">
      </p-panelMenu>
    </nav>

    <!-- Footer info -->
    <div
      class="surface-card border-round px-3 py-2 shadow-1"
      style="border-radius: 5px;">
      <div class="flex align-items-center justify-content-center gap-2 text-600 text-sm font-medium">
        <i class="pi pi-shield text-green-500"></i>
        <span>Seguimiento de egresados</span>
      </div>
    </div>
  </div>
</p-sidebar>
