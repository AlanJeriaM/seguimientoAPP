<!-- Botón para abrir el sidebar -->
<button
  type="button"
  pButton
  icon="pi pi-bars"
  class="sidebar-toggle-btn"
  (click)="toggleSidebar()">
</button>

<!-- Sidebar -->
<p-sidebar
  [(visible)]="visibleSidebar"
  [position]="'left'"
  [modal]="true"
  [showCloseIcon]="false"
  [style]="{'width': '320px'}"
  styleClass="custom-sidebar">

  <!-- Header con diseño mejorado -->
  <ng-template pTemplate="header">
    <div class="sidebar-header-content">
      <div class="header-text">
        <i class="pi" [ngClass]="isAdmin ? 'pi-shield' : 'pi-user'" style="font-size: 1.2rem; margin-right: 0.5rem;"></i>
        <span class="header-title">{{ isAdmin ? 'Administrador' : 'Panel usuario' }}</span>
      </div>
      <button
        type="button"
        pButton
        icon="pi pi-times"
        class="p-button-rounded p-button-text header-close-btn"
        (click)="toggleSidebar()">
      </button>
    </div>
  </ng-template>

  <!-- Contenido principal -->
  <div class="sidebar-main-content">

    <!-- Card de perfil -->
    <div class="profile-card" (click)="goToPerfil()">
      <div class="profile-background"></div>

      <div class="profile-content">
        <!-- Avatar -->
        <div class="avatar-container">
          <img
            *ngIf="!isAdmin && perfilImagenUrl && !imageError"
            [src]="perfilImagenUrl"
            alt="Perfil"
            class="avatar-image"
            (error)="handleImageError($event)" />

          <div
            *ngIf="!isAdmin && (!perfilImagenUrl || imageError)"
            class="avatar-fallback">
            <span>{{ getUserInitials() }}</span>
          </div>

          <img
            *ngIf="isAdmin"
            class="avatar-image"
            [src]="'assets/icons/admin4.png'"
            alt="Admin" />

          <div class="avatar-status"></div>
        </div>

        <!-- Nombre y rol -->
        <div class="profile-info">
          <h3 class="profile-username">{{ nameUser }}</h3>
          <span class="profile-role">
            <i class="pi pi-circle-fill" style="font-size: 0.4rem; margin-right: 0.4rem;"></i>
            {{ isAdmin ? 'Administrador' : 'Egresado' }}
          </span>
        </div>
      </div>
    </div>

    <!-- Navegación -->
    <nav class="sidebar-navigation">
      <p-panelMenu
        [model]="itemsPanelMenu"
        styleClass="custom-panel-menu">
      </p-panelMenu>
    </nav>

    <!-- Footer info -->
    <div class="sidebar-footer">
      <div class="footer-item">
        <i class="pi pi-shield"></i>
        <span>Seguimiento de egresados</span>
      </div>
    </div>
  </div>
</p-sidebar>
